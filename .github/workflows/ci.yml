name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo test --all
      - run: cargo test -p platform-runner -p platform-web -- --ignored --test-threads=1
      - run: node --test
        working-directory: sdk/node
      - run: node --test
        working-directory: examples/bot-node
      - run: node --test
        working-directory: examples/discord-bot
